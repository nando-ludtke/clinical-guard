[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-guard"
version = "0.1.0"
description = "Deterministic pre-generation safety guard and role-based clinical routing microservice."
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "litellm>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0,<6.0",
    "transformers>=4.45,<5.0",
    "torch>=2.2",
    "onnxruntime>=1.19",
    "optimum[onnxruntime]>=1.23",
]
privacy = [
    "onnxruntime>=1.19",
    "optimum[onnxruntime]>=1.23",
    "transformers>=4.45,<5.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_guard = ["static/*.html", "context/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
